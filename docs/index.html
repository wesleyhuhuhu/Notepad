<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Local LLM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #e3e2dd;
  --accent: #3b5bdb; --accent-text: #ffffff; --user-bubble: #e9ecf8; --code-bg: #f0efea;
  --ok: #2f9e44; --bad: #e03131; --warn: #e8590c; --chip: #f1f0ec;
  --radius: 12px; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a9993; --border: #33322f;
    --accent: #748ffc; --accent-text: #0e0e0d; --user-bubble: #262b40; --code-bg: #2a2a27; --chip: #2a2a27;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a9993; --border: #33322f;
  --accent: #748ffc; --accent-text: #0e0e0d; --user-bubble: #262b40; --code-bg: #2a2a27; --chip: #2a2a27;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; height: 100dvh;
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; white-space: nowrap;
}
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }

header {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  border-bottom: 1px solid var(--border); background: var(--panel);
}
header h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; }
#project {
  min-width: 0; max-width: 240px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); font-weight: 600;
}
.status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; min-width: 0; flex: 1; }
.status span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
header .actions { display: flex; gap: 6px; }

.layout { flex: 1; display: flex; min-height: 0; }
.chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.chat-col.drag { outline: 2px dashed var(--accent); outline-offset: -8px; }
.msgwrap { flex: 1; min-height: 0; position: relative; display: flex; }
#messages { flex: 1; overflow-y: auto; padding: 20px 16px; overscroll-behavior: contain; }
#jump {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
  border-radius: 999px; padding: 5px 14px; font-size: 13px; box-shadow: 0 2px 8px rgb(0 0 0 / .15);
}
.thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; justify-content: flex-end; }
.thumb { position: relative; flex: none; }
.thumb img, .thumb .ph {
  width: 88px; height: 88px; object-fit: cover; border-radius: 8px; display: block;
  background: var(--chip); border: 1px solid var(--border);
}
.thumb .badge {
  position: absolute; left: 4px; bottom: 4px; background: rgb(0 0 0 / .65); color: #fff;
  font-size: 11px; padding: 1px 6px; border-radius: 999px; max-width: calc(100% - 8px);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.thumb .rm {
  position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; padding: 0;
  border-radius: 50%; line-height: 1; font-size: 13px;
}
.thumb.bad img, .thumb.bad .ph { outline: 2px solid var(--bad); }
#tray { justify-content: flex-start; flex-wrap: wrap; margin-bottom: 10px; padding-top: 7px; }
#tray:empty { display: none; }
#attach { height: 42px; width: 42px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
#attach svg { width: 20px; height: 20px; }
.inner { max-width: 780px; margin: 0 auto; }
.msg { margin: 0 0 18px; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .bubble {
  background: var(--user-bubble); padding: 9px 14px; border-radius: var(--radius);
  max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere;
}
.msg.assistant .body { overflow-wrap: anywhere; }
.body > :first-child { margin-top: 0; } .body > :last-child { margin-bottom: 0; }
.body pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
.body code { font-family: var(--mono); font-size: .9em; }
.body :not(pre) > code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.body table { border-collapse: collapse; display: block; overflow-x: auto; }
.body th, .body td { border: 1px solid var(--border); padding: 4px 8px; }
.body a { color: var(--accent); }
details.reasoning { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
details.reasoning summary { cursor: pointer; user-select: none; }
details.reasoning div { white-space: pre-wrap; border-left: 2px solid var(--border); padding-left: 10px; margin-top: 6px; max-height: 300px; overflow-y: auto; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.tool {
  display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border: 1px solid var(--border);
  border-radius: 999px; padding: 2px 10px; font-size: 12.5px; color: var(--muted); max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tool.ok::before { content: "✓"; color: var(--ok); }
.tool.bad::before { content: "✕"; color: var(--bad); }
.tool.pending::before { content: "…"; }
.err { color: var(--bad); font-size: 14px; }
.notice { color: var(--muted); font-size: 13px; font-style: italic; margin-bottom: 8px; }
.cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--muted); }
@keyframes blink { 50% { opacity: 0; } }

.empty { text-align: center; color: var(--muted); margin-top: 10vh; }
.empty h2 { color: var(--text); font-weight: 600; font-size: 20px; margin-bottom: 6px; }
.empty .cta { margin-top: 16px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

.composer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
.composer .inner { display: flex; gap: 8px; align-items: flex-end; }
#input {
  flex: 1; resize: none; max-height: 200px; min-height: 42px; padding: 9px 12px; overflow-y: hidden;
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); outline: none;
}
#input:focus { border-color: var(--accent); }
#send { height: 42px; min-width: 70px; }
.composer .meta { display: flex; gap: 14px; margin-top: 6px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.composer label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.composer select { background: transparent; border: none; color: var(--muted); max-width: 260px; padding: 0; }

aside#mdpanel {
  width: 460px; max-width: 100%; border-left: 1px solid var(--border); background: var(--panel);
  display: none; flex-direction: column; min-height: 0;
}
aside#mdpanel.open { display: flex; }
.md-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.md-head .seg { display: flex; flex: 1; min-width: 0; }
.seg button { border-radius: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
.seg button:first-child { border-radius: 8px 0 0 8px; }
.seg button:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); position: relative; }
.md-path { font-size: 12px; color: var(--muted); padding: 6px 14px 0; font-family: var(--mono); overflow-wrap: anywhere; }
#mdtext {
  flex: 1; margin: 10px 14px; resize: none; border: 1px solid var(--border); border-radius: 8px;
  padding: 10px; background: var(--bg); font-family: var(--mono); font-size: 13px; line-height: 1.5; outline: none;
}
#mdtext:focus { border-color: var(--accent); }
.md-foot { display: flex; gap: 8px; align-items: center; padding: 0 14px 14px; flex-wrap: wrap; }
.md-foot .note { flex: 1 1 160px; font-size: 12.5px; color: var(--muted); }
@media (max-width: 860px) {
  aside#mdpanel.open { position: fixed; inset: 0; width: auto; z-index: 20; border: none; }
}

dialog {
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); color: var(--text);
  width: min(520px, calc(100vw - 32px)); padding: 20px;
}
dialog::backdrop { background: rgb(0 0 0 / .4); }
dialog h2 { margin: 0 0 14px; font-size: 18px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.field input[type=text], .field input[type=password], .field input[type=url], .field textarea, .field select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
}
.field .hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.field.check label { display: flex; gap: 8px; align-items: center; font-weight: 400; }
.row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
.row .grow { flex: 1; font-size: 13px; }
@media (max-width: 600px) {
  header { flex-wrap: wrap; row-gap: 8px; }
  header h1 { display: none; }
  #project { flex: 1 1 100%; max-width: none; }
  .status { order: 2; flex: 1 1 0; }
  header .actions { order: 3; }
  header .actions button { padding: 6px 9px; }
}
</style>
</head>
<body>
<header>
  <h1>Local LLM</h1>
  <select id="project" title="Project"><option value="">No project</option></select>
  <div class="status" title="Bridge status"><span class="dot" id="dot"></span><span id="statusText">Not connected</span></div>
  <div class="actions">
    <button id="btnMd" title="View and edit CLAUDE.md">CLAUDE.md</button>
    <button id="btnNew" title="Clear this chat">New chat</button>
    <button id="btnSettings" title="Settings">Settings</button>
  </div>
</header>

<div class="layout">
  <div class="chat-col">
    <div class="msgwrap">
      <div id="messages" tabindex="-1"><div class="inner" id="list"></div></div>
      <button id="jump" hidden>↓ Latest</button>
    </div>
    <div class="composer">
      <div class="inner" id="tray"></div>
      <div class="inner">
        <button id="attach" title="Attach images or a video" aria-label="Attach images or a video">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="fileInput" accept="image/*,video/*" multiple hidden>
        <textarea id="input" rows="1" placeholder="Message your local model…"></textarea>
        <button id="send" class="primary">Send</button>
      </div>
      <div class="inner meta">
        <label title="Model to use">Model <select id="model"><option value="">(default)</option></select></label>
        <label title="Let the model change CLAUDE.md files with tools"><input type="checkbox" id="allowEdits" checked> Model can edit CLAUDE.md</label>
      </div>
    </div>
  </div>

  <aside id="mdpanel" aria-label="CLAUDE.md editor">
    <div class="md-head">
      <div class="seg" role="group" aria-label="Which CLAUDE.md">
        <button id="segProject" aria-pressed="true">Project</button>
        <button id="segGlobal" aria-pressed="false">Global</button>
      </div>
      <button id="mdReload">Reload</button>
      <button id="mdClose">Close</button>
    </div>
    <div class="md-path" id="mdPath"></div>
    <textarea id="mdtext" spellcheck="false"></textarea>
    <div class="md-foot">
      <span class="note" id="mdNote"></span>
      <button id="mdGenerate" title="Have the model read the project and write its CLAUDE.md">Generate from code</button>
      <button id="mdSave" class="primary">Save</button>
    </div>
  </aside>
</div>

<dialog id="newProject">
  <form method="dialog" id="newProjectForm">
    <h2>New project</h2>
    <div class="field">
      <label for="npName">Name</label>
      <input type="text" id="npName" maxlength="80" placeholder="e.g. Weather App" autocomplete="off" required>
      <div class="hint" id="npWhere">Creates a folder with a starter CLAUDE.md on your PC.</div>
    </div>
    <div class="field">
      <label for="npDesc">What is it? (optional)</label>
      <textarea id="npDesc" rows="3" placeholder="One or two sentences. Goes in the Overview section of its CLAUDE.md."></textarea>
    </div>
    <div class="row">
      <span class="grow err" id="npResult"></span>
      <button value="cancel" formnovalidate>Cancel</button>
      <button type="button" class="primary" id="npCreate">Create</button>
    </div>
  </form>
</dialog>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>Settings</h2>
    <div class="field">
      <label for="sUrl">Bridge URL</label>
      <input type="url" id="sUrl" placeholder="https://your-pc.your-tailnet.ts.net" autocomplete="off">
      <div class="hint">The public address printed by <code>start.ps1</code> on your PC.</div>
    </div>
    <div class="field">
      <label for="sToken">Access token</label>
      <input type="password" id="sToken" autocomplete="off">
      <div class="hint">From <code>bridge/config.json</code>. Stored only in this browser.</div>
    </div>
    <div class="field">
      <label for="sSystem">Extra system prompt (optional)</label>
      <textarea id="sSystem" rows="3"></textarea>
      <div class="hint">Added after the CLAUDE.md files. Use CLAUDE.md for anything you want kept on the PC.</div>
    </div>
    <div class="field">
      <label for="sTheme">Theme</label>
      <select id="sTheme"><option value="">Match system</option><option value="light">Light</option><option value="dark">Dark</option></select>
    </div>
    <div class="row">
      <span class="grow" id="sResult"></span>
      <button type="button" id="sTest">Test connection</button>
      <button value="cancel" formnovalidate>Cancel</button>
      <button value="save" class="primary" id="sSave">Save</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('llm.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('llm.' + k, JSON.stringify(v)); } catch {} },
  };
  const NEW_PROJECT = '__new__';

  // One-click setup: index.html#bridge=<url>&token=<token>
  function consumeHash() {
    if (location.hash.length <= 1) return false;
    const p = new URLSearchParams(location.hash.slice(1));
    if (!p.get('bridge') && !p.get('token')) return false;
    if (p.get('bridge')) store.set('bridgeUrl', p.get('bridge'));
    if (p.get('token')) store.set('token', p.get('token'));
    history.replaceState(null, '', location.pathname + location.search);
    return true;
  }
  consumeHash();

  let settings = {
    bridgeUrl: store.get('bridgeUrl', ''),
    token: store.get('token', ''),
    system: store.get('system', ''),
    theme: store.get('theme', ''),
  };
  let project = store.get('project', '');
  let projects = [];
  let status = null;
  let messages = [];
  let busy = null; // AbortController while streaming
  let mdScope = 'project';

  window.addEventListener('hashchange', () => {
    if (!consumeHash()) return;
    settings.bridgeUrl = store.get('bridgeUrl', '');
    settings.token = store.get('token', '');
    if ($('settings').open) $('settings').close('cancel');
    connect();
  });

  const applyTheme = () => {
    if (settings.theme) document.documentElement.dataset.theme = settings.theme;
    else delete document.documentElement.dataset.theme;
  };
  applyTheme();

  const base = () => settings.bridgeUrl.replace(/\/+$/, '');
  const api = (path, opts = {}) =>
    fetch(base() + path, {
      ...opts,
      headers: { Authorization: 'Bearer ' + settings.token, 'Content-Type': 'application/json', ...(opts.headers || {}) },
    });
  async function apiJson(path, opts) {
    const r = await api(path, opts);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Error ' + r.status);
    return j;
  }
  const q = (p) => (p ? '?project=' + encodeURIComponent(p) : '');
  const historyKey = () => 'messages:' + (project || '');

  // ------------------------------------------------------------ status --
  function setStatus(kind, text) {
    $('dot').className = 'dot ' + (kind || '');
    $('statusText').textContent = text;
  }

  async function refreshStatus() {
    if (!settings.bridgeUrl || !settings.token) { setStatus('warn', 'Open Settings to connect'); return null; }
    try {
      const r = await api('/api/status');
      if (r.status === 401) { setStatus('bad', 'Wrong access token'); return null; }
      if (!r.ok) { setStatus('bad', 'Bridge error ' + r.status); return null; }
      status = await r.json();
      if (!status.lmStudio.reachable) setStatus('warn', 'PC online, LM Studio off');
      else {
        const loaded = status.lmStudio.models.filter((m) => m.loaded);
        setStatus('ok', loaded.length ? loaded.map((m) => m.id).join(', ') : 'Connected (no model loaded)');
      }
      fillModels(status);
      updateAttach();
      $('allowEdits').disabled = !status.allowModelEdits;
      if (!status.allowModelEdits) $('allowEdits').checked = false;
      return status;
    } catch {
      setStatus('bad', 'PC unreachable');
      return null;
    }
  }

  function fillModels(s) {
    const sel = $('model');
    const keep = store.get('model', '');
    sel.innerHTML = '';
    const def = document.createElement('option');
    def.value = '';
    def.textContent = s.defaultModel ? `(default: ${s.defaultModel})` : '(loaded model)';
    sel.appendChild(def);
    for (const m of s.lmStudio.models || []) {
      const o = document.createElement('option');
      o.value = m.id;
      o.textContent = m.id + (m.loaded ? ' ●' : '');
      sel.appendChild(o);
    }
    sel.value = [...sel.options].some((o) => o.value === keep) ? keep : '';
  }

  // ---------------------------------------------------------- projects --
  async function loadProjects() {
    if (!settings.bridgeUrl || !settings.token) return;
    try {
      const j = await apiJson('/api/projects');
      projects = j.projects;
      $('npWhere').textContent = `Creates a folder in ${j.root} with a starter CLAUDE.md.`;
    } catch {
      projects = [];
    }
    fillProjects();
  }

  function fillProjects() {
    const sel = $('project');
    sel.innerHTML = '';
    const add = (value, text) => { const o = document.createElement('option'); o.value = value; o.textContent = text; sel.appendChild(o); };
    add('', 'No project');
    for (const p of projects) add(p.name, p.name + (p.hasClaudeMd ? '' : ' (no CLAUDE.md)'));
    add(NEW_PROJECT, '+ New project…');
    if (project && !projects.some((p) => p.name === project)) project = '';
    sel.value = project;
  }

  function switchProject(name) {
    if (busy) busy.abort();
    project = name;
    mdScope = project ? 'project' : 'global';
    store.set('project', project);
    $('project').value = project;
    messages = store.get(historyKey(), []);
    render();
    updateMdControls();
    if ($('mdpanel').classList.contains('open')) loadMd();
  }

  async function createProject() {
    const name = $('npName').value.trim();
    if (!name) { $('npResult').textContent = 'Enter a name.'; return; }
    $('npCreate').disabled = true;
    $('npResult').textContent = '';
    try {
      await apiJson('/api/projects', { method: 'POST', body: JSON.stringify({ name, description: $('npDesc').value }) });
      $('newProject').close('created');
      await loadProjects();
      switchProject(name);
    } catch (e) {
      $('npResult').textContent = e.message;
    } finally {
      $('npCreate').disabled = false;
    }
  }

  // ------------------------------------------------------------ render --
  function splitThink(text) {
    let reasoning = '';
    let out = text.replace(/<think>([\s\S]*?)<\/think>/g, (_, r) => { reasoning += r; return ''; });
    const open = out.indexOf('<think>');
    if (open >= 0) { reasoning += out.slice(open + 7); out = out.slice(0, open); }
    return { reasoning: reasoning.trim(), content: out.trim() };
  }

  const md = (t) => DOMPurify.sanitize(marked.parse(t || '', { gfm: true, breaks: true }));

  function toolLabel(t) {
    const g = t.args && t.args.scope === 'global' ? ' (global)' : '';
    switch (t.name) {
      case 'read_claude_md': return 'Read CLAUDE.md' + g;
      case 'append_to_claude_md': return 'Added to CLAUDE.md' + g;
      case 'replace_in_claude_md': return 'Edited CLAUDE.md' + g;
      case 'write_claude_md': return 'Wrote CLAUDE.md' + g;
      case 'list_project_files': return 'Listed ' + ((t.args && t.args.path) || 'project files');
      case 'read_project_file': return 'Read ' + ((t.args && t.args.path) || 'a file');
      default: return t.name;
    }
  }

  const div = (cls) => { const d = document.createElement('div'); if (cls) d.className = cls; return d; };

  // Builds the message's elements once, then only updates what changed. Rebuilding
  // everything on every streamed token made scrolling jump and undid any
  // expand/collapse or scrolling inside the reasoning box.
  function renderAssistant(el, m, streaming) {
    let v = el._view;
    if (!v) {
      el.textContent = '';
      v = el._view = {
        notice: div('notice'), details: document.createElement('details'), summary: document.createElement('summary'),
        rbox: div(), tools: div('tools'), body: div('body'), err: div('err'),
        reason: null, content: null, toolsKey: null,
      };
      v.details.className = 'reasoning';
      v.details.append(v.summary, v.rbox);
      // Remember the user's choice so streaming doesn't keep re-opening or closing it.
      v.summary.addEventListener('click', () => { m.reasoningOpen = !v.details.open; });
      el.append(v.notice, v.details, v.tools, v.body, v.err);
    }
    const { reasoning: inlineR, content } = splitThink(m.content || '');
    const reasoning = [m.reasoning || '', inlineR].filter(Boolean).join('\n').trim();

    v.notice.hidden = !(streaming && m.notice);
    if (!v.notice.hidden) v.notice.textContent = m.notice;

    v.details.hidden = !reasoning;
    if (reasoning) {
      const thinking = streaming && !content;
      v.summary.textContent = thinking ? 'Thinking…' : 'Reasoning';
      const open = m.reasoningOpen !== undefined ? m.reasoningOpen : thinking;
      if (v.details.open !== open) v.details.open = open;
      if (reasoning !== v.reason) {
        const rb = v.rbox;
        const atEnd = rb.scrollHeight - rb.scrollTop - rb.clientHeight < 8;
        rb.textContent = reasoning;
        v.reason = reasoning;
        if (atEnd) rb.scrollTop = rb.scrollHeight;
      }
    }

    const tools = m.tools || [];
    const toolsKey = JSON.stringify(tools.map((t) => [t.name, t.ok, t.args && t.args.path, t.args && t.args.scope]));
    if (toolsKey !== v.toolsKey) {
      v.toolsKey = toolsKey;
      v.tools.textContent = '';
      v.tools.hidden = !tools.length;
      for (const t of tools) {
        const c = document.createElement('span');
        c.className = 'tool ' + (t.ok === undefined ? 'pending' : t.ok ? 'ok' : 'bad');
        c.textContent = toolLabel(t);
        if (t.result && !t.ok) c.title = t.result;
        v.tools.appendChild(c);
      }
    }

    v.body.className = 'body' + (streaming ? ' cursor' : '');
    if (content !== v.content) {
      v.content = content;
      v.body.innerHTML = md(content);
    }

    v.err.hidden = !m.error;
    if (m.error) v.err.textContent = m.error;
  }

  function render() {
    const list = $('list');
    list.innerHTML = '';
    if (!messages.length) {
      const p = projects.find((x) => x.name === project);
      const div = document.createElement('div');
      div.className = 'empty';
      if (project) {
        div.innerHTML = '<h2></h2><p></p><div class="cta"></div>';
        div.querySelector('h2').textContent = project;
        div.querySelector('p').textContent = p && !p.hasClaudeMd
          ? "This project doesn't have a CLAUDE.md yet. The model can read the code and write one."
          : "The model reads this project's CLAUDE.md and the global one on every message, and can look at the project's files.";
        const cta = div.querySelector('.cta');
        const gen = document.createElement('button');
        gen.className = p && !p.hasClaudeMd ? 'primary' : '';
        gen.textContent = p && !p.hasClaudeMd ? 'Generate CLAUDE.md from code' : 'Refresh CLAUDE.md from code';
        gen.onclick = generateMd;
        const open = document.createElement('button');
        open.textContent = 'Open CLAUDE.md';
        open.onclick = () => openPanel('project');
        cta.append(gen, open);
      } else {
        div.innerHTML = '<h2>Your model, from anywhere</h2><p>Pick a project at the top to give the model that project\'s CLAUDE.md and code, or just chat. The global CLAUDE.md is always included.</p>';
      }
      list.appendChild(div);
      return;
    }
    for (const m of messages) list.appendChild(msgEl(m));
    scrollDown(true);
  }

  function msgEl(m, streaming) {
    const el = document.createElement('div');
    el.className = 'msg ' + m.role;
    if (m.role === 'user') {
      const b = div('bubble');
      if (m.attachments && m.attachments.length) {
        const t = div('thumbs');
        for (const a of m.attachments) t.appendChild(thumbEl(a.thumb, a.name, a.kind === 'video' ? `▶ ${a.frames} frames` : ''));
        b.appendChild(t);
      }
      if (m.content) b.appendChild(document.createTextNode(m.content));
      el.appendChild(b);
    } else renderAssistant(el, m, streaming);
    return el;
  }

  function thumbEl(src, name, badge) {
    const w = div('thumb');
    if (src) {
      const img = new Image();
      img.src = src;
      img.alt = name || '';
      img.title = name || '';
      w.appendChild(img);
    } else w.appendChild(div('ph'));
    if (badge) { const b = div('badge'); b.textContent = badge; w.appendChild(b); }
    return w;
  }

  // ------------------------------------------------------------ scroll --
  // Follow new output only while the user is at the bottom. Any upward scroll
  // (wheel, touch, keys, scrollbar) stops following until they come back down.
  const box = $('messages');
  let stick = true;
  let touching = false;
  const distance = () => box.scrollHeight - box.scrollTop - box.clientHeight;
  const updateJump = () => { $('jump').hidden = distance() < 200; };
  function scrollDown(force) {
    if (force) stick = true;
    if (stick) box.scrollTop = box.scrollHeight;
    updateJump();
  }
  box.addEventListener('scroll', () => {
    const d = distance();
    if (d <= 4 && !touching) stick = true;
    else if (d > 40) stick = false;
    updateJump();
  }, { passive: true });
  box.addEventListener('wheel', (e) => { if (e.deltaY < 0) stick = false; }, { passive: true });
  box.addEventListener('touchstart', () => { touching = true; }, { passive: true });
  box.addEventListener('touchmove', () => { stick = false; }, { passive: true });
  box.addEventListener('touchend', () => { touching = false; if (distance() <= 4) stick = true; }, { passive: true });
  box.addEventListener('keydown', (e) => { if (['PageUp', 'ArrowUp', 'Home'].includes(e.key)) stick = false; });
  $('jump').addEventListener('click', () => {
    stick = true;
    box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
  });

  const save = (key, msgs) => store.set(key, msgs.slice(-100));

  // ------------------------------------------------------- attachments --
  // Images are shrunk in the browser before sending (fewer tokens, faster upload).
  // Videos become a handful of still frames, since the model reads images, not video.
  const IMG_MAX = 1280;        // longest side for photos/screenshots
  const FRAME_MAX = 768;       // longest side for video frames
  const MAX_FRAMES = 8;        // frames per video (about one per second for short clips)
  const MAX_IMAGES = 16;       // images per message, counting video frames
  let pending = [];            // attachments waiting in the composer
  const liveParts = new WeakMap(); // full images for messages sent in this tab (not saved)

  function canvasJpeg(src, w, h, max, quality) {
    const scale = Math.min(1, max / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * scale));
    c.height = Math.max(1, Math.round(h * scale));
    const g = c.getContext('2d');
    g.fillStyle = '#fff';
    g.fillRect(0, 0, c.width, c.height);
    g.drawImage(src, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', quality);
  }

  async function decodeImage(file) {
    try {
      const bmp = await createImageBitmap(file);
      return { src: bmp, w: bmp.width, h: bmp.height };
    } catch {
      const url = URL.createObjectURL(file);
      try {
        const img = new Image();
        img.src = url;
        await img.decode();
        return { src: img, w: img.naturalWidth, h: img.naturalHeight };
      } catch {
        throw new Error("This browser can't open that image format.");
      } finally {
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
    }
  }

  const waitFor = (target, event, ms = 8000) => new Promise((res, rej) => {
    const t = setTimeout(() => { target.removeEventListener(event, ok); rej(new Error('Timed out reading the video.')); }, ms);
    function ok() { clearTimeout(t); target.removeEventListener(event, ok); res(); }
    target.addEventListener(event, ok);
  });

  async function videoFrames(file) {
    const url = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.muted = true;
    v.playsInline = true;
    v.preload = 'auto';
    try {
      const meta = waitFor(v, 'loadedmetadata', 15000);
      const fail = new Promise((_, rej) => { v.onerror = () => rej(new Error("This browser can't play that video format.")); });
      v.src = url;
      await Promise.race([meta, fail]);
      // Some recordings (e.g. WebM) don't report a length until you seek to the end.
      if (!isFinite(v.duration)) {
        v.currentTime = 1e9;
        await waitFor(v, 'seeked').catch(() => {});
      }
      const dur = isFinite(v.duration) && v.duration > 0 ? v.duration : 0;
      const n = dur ? Math.min(MAX_FRAMES, Math.max(1, Math.round(dur))) : 1;
      const times = Array.from({ length: n }, (_, i) => (dur ? (dur * (i + 0.5)) / n : 0));
      const frames = [];
      let thumb = '';
      for (const t of times) {
        // Always seek, even to the current position, so the frame is actually decoded.
        v.currentTime = Math.abs(v.currentTime - t) < 0.001 ? t + 0.001 : t;
        await waitFor(v, 'seeked');
        frames.push(canvasJpeg(v, v.videoWidth, v.videoHeight, FRAME_MAX, 0.8));
        if (!thumb) thumb = canvasJpeg(v, v.videoWidth, v.videoHeight, 176, 0.7);
      }
      const fmt = (s) => s.toFixed(1) + 's';
      const note = `[Video "${file.name || 'video'}", ${fmt(dur)} long. The ${n} images below are frames from it at ${times.map(fmt).join(', ')}. There is no audio.]`;
      return { frames, thumb, note };
    } finally {
      v.removeAttribute('src');
      v.load();
      URL.revokeObjectURL(url);
    }
  }

  const imageCount = () => pending.reduce((n, p) => n + (p.images ? p.images.length : p.kind === 'video' ? MAX_FRAMES : 1), 0);

  async function addFiles(files) {
    for (const f of files) {
      const isVideo = /^video\//.test(f.type);
      const isImage = /^image\//.test(f.type) || /\.(heic|heif)$/i.test(f.name || '');
      if (!isVideo && !isImage) continue;
      if (imageCount() >= MAX_IMAGES) { flashTray(`Up to ${MAX_IMAGES} images per message (a video counts as up to ${MAX_FRAMES}).`); break; }
      const item = { kind: isVideo ? 'video' : 'image', name: f.name || (isVideo ? 'video' : 'pasted image'), loading: true };
      pending.push(item);
      renderTray();
      try {
        if (isVideo) {
          const r = await videoFrames(f);
          Object.assign(item, { images: r.frames, thumb: r.thumb, note: r.note });
        } else {
          const d = await decodeImage(f);
          item.images = [canvasJpeg(d.src, d.w, d.h, IMG_MAX, 0.85)];
          item.thumb = canvasJpeg(d.src, d.w, d.h, 176, 0.7);
          if (d.src.close) d.src.close();
        }
      } catch (e) {
        item.error = e.message || 'Could not read this file.';
      }
      item.loading = false;
      renderTray();
    }
  }

  function renderTray() {
    const tray = $('tray');
    tray.textContent = '';
    for (const p of pending) {
      const badge = p.loading ? 'Reading…' : p.error ? 'Error' : p.kind === 'video' ? `▶ ${p.images.length} frames` : '';
      const t = thumbEl(p.thumb, p.error || p.name, badge);
      if (p.error) t.classList.add('bad');
      const rm = document.createElement('button');
      rm.className = 'rm';
      rm.type = 'button';
      rm.textContent = '×';
      rm.title = 'Remove';
      rm.onclick = () => { pending = pending.filter((x) => x !== p); renderTray(); };
      t.appendChild(rm);
      tray.appendChild(t);
    }
  }

  let flashTimer = 0;
  function flashTray(msg) {
    $('input').placeholder = msg;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => { $('input').placeholder = 'Message your local model…'; }, 4000);
  }

  function visionAvailable() {
    if (!status || !status.lmStudio || !status.lmStudio.models) return true;
    const models = status.lmStudio.models;
    const id = $('model').value || status.defaultModel || (models.find((m) => m.loaded) || {}).id;
    const m = models.find((x) => x.id === id);
    return !m || m.vision !== false;
  }
  function updateAttach() {
    const ok = visionAvailable();
    $('attach').disabled = !ok;
    $('attach').title = ok ? 'Attach images or a video' : "The selected model can't see images";
  }

  // What gets sent to the model for one stored message.
  function apiMessage(m) {
    if (m.role === 'user' && m.attachments && m.attachments.length) {
      const parts = liveParts.get(m);
      if (parts) return { role: 'user', content: parts };
      const gone = m.attachments.map((a) => `[${a.kind === 'video' ? 'A video' : 'An image'} ("${a.name}") was attached here earlier but is no longer available.]`).join('\n');
      return { role: 'user', content: [m.content, gone].filter(Boolean).join('\n\n') };
    }
    return { role: m.role, content: m.content };
  }

  // -------------------------------------------------------------- chat --
  async function send(textOverride) {
    if (busy) { busy.abort(); return; }
    const fromInput = typeof textOverride !== 'string';
    const text = (fromInput ? $('input').value : textOverride).trim();
    if (fromInput && pending.some((p) => p.loading)) { flashTray('Still reading attachments…'); return; }
    const atts = fromInput ? pending.filter((p) => !p.error && p.images && p.images.length) : [];
    if (!text && !atts.length) return;
    if (!settings.bridgeUrl || !settings.token) { openSettings(); return; }

    if (fromInput) { $('input').value = ''; autosize(); pending = []; renderTray(); }
    const chatProject = project;
    const chatKey = historyKey();
    const chat = messages;
    if (!chat.length) $('list').innerHTML = '';
    const user = { role: 'user', content: text };
    if (atts.length) {
      user.attachments = atts.map((a) => ({ kind: a.kind, name: a.name, thumb: a.thumb, frames: a.images.length }));
      const notes = atts.map((a) => a.note).filter(Boolean);
      const intro = [text || (atts.length > 1 ? 'Here are some images.' : 'Here is an image.'), ...notes].join('\n\n');
      liveParts.set(user, [
        { type: 'text', text: intro },
        ...atts.flatMap((a) => a.images.map((url) => ({ type: 'image_url', image_url: { url } }))),
      ]);
    }
    chat.push(user);
    $('list').appendChild(msgEl(user));
    const a = { role: 'assistant', content: '', reasoning: '', tools: [] };
    chat.push(a);
    const el = msgEl(a, true);
    $('list').appendChild(el);
    scrollDown(true);

    busy = new AbortController();
    $('send').textContent = 'Stop';
    let frame = 0;
    const paint = () => { if (!frame) frame = requestAnimationFrame(() => { frame = 0; renderAssistant(el, a, true); scrollDown(); }); };

    try {
      const history = chat.slice(0, -1).filter((m) => !m.error || m.content).map(apiMessage);
      const r = await api('/api/chat', {
        method: 'POST',
        signal: busy.signal,
        body: JSON.stringify({
          messages: history,
          project: chatProject || undefined,
          model: $('model').value || undefined,
          allowEdits: $('allowEdits').checked,
          system: settings.system || undefined,
        }),
      });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        throw new Error(j.error || 'Bridge error ' + r.status);
      }
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, i);
          buf = buf.slice(i + 2);
          for (const line of chunk.split('\n')) {
            if (!line.startsWith('data:')) continue;
            let ev;
            try { ev = JSON.parse(line.slice(5)); } catch { continue; }
            handleEvent(a, ev);
          }
        }
        paint();
      }
    } catch (e) {
      if (e.name !== 'AbortError') a.error = /Failed to fetch|NetworkError|Load failed/i.test(e.message) ? 'Could not reach your PC. Is the bridge running?' : e.message;
      else if (!a.content) a.error = 'Stopped.';
    } finally {
      busy = null;
      $('send').textContent = 'Send';
      if (frame) cancelAnimationFrame(frame), frame = 0;
      renderAssistant(el, a, false);
      scrollDown();
      save(chatKey, chat);
    }
  }

  function handleEvent(a, ev) {
    switch (ev.type) {
      case 'token': a.content += ev.text; break;
      case 'reasoning': a.reasoning += ev.text; break;
      case 'round_end':
        if (a.content && !a.content.endsWith('\n\n')) a.content += '\n\n';
        break;
      case 'tool_call': a.tools.push({ id: ev.id, name: ev.name, args: ev.args }); break;
      case 'tool_result': {
        const t = a.tools.find((x) => x.id === ev.id) || {};
        t.ok = ev.ok; t.result = ev.result;
        break;
      }
      case 'claude_md_updated':
        if (ev.scope === 'project') {
          const p = projects.find((x) => x.name === ev.project);
          if (p && !p.hasClaudeMd) { p.hasClaudeMd = true; fillProjects(); }
        }
        if ($('mdpanel').classList.contains('open') && ev.scope === mdScope) loadMd(true);
        break;
      case 'status': a.notice = ev.text; break;
      case 'error': a.error = ev.message; break;
    }
  }

  function generateMd() {
    if (!project) return;
    if (!$('allowEdits').checked) { $('allowEdits').checked = true; store.set('allowEdits', true); }
    send('Look through this project\'s files (README, config and main source files) and write its CLAUDE.md with write_claude_md. ' +
      'Sections: Overview, Tech stack, Structure, Commands (build/run/test), Conventions, Notes. Be concise and only include what the files show. ' +
      'Keep anything useful that is already in the current CLAUDE.md.');
  }

  // --------------------------------------------------------- CLAUDE.md --
  let mdLoaded = '';
  const mdTargetProject = () => (mdScope === 'project' ? project : '');

  function updateMdControls() {
    const hasProject = !!project;
    if (!hasProject) mdScope = 'global';
    $('segProject').disabled = !hasProject;
    $('segProject').textContent = hasProject ? project : 'Project';
    $('segProject').title = hasProject ? `CLAUDE.md for ${project}` : 'Pick a project first';
    $('segProject').setAttribute('aria-pressed', String(mdScope === 'project'));
    $('segGlobal').setAttribute('aria-pressed', String(mdScope === 'global'));
    $('mdGenerate').style.display = mdScope === 'project' && hasProject && status && status.allowCodeReading ? '' : 'none';
    $('mdtext').placeholder = mdScope === 'project'
      ? 'This project has no CLAUDE.md yet. Write one here, or use "Generate from code".'
      : 'The global CLAUDE.md is empty. Write instructions or notes that apply to every chat.';
  }

  function openPanel(scope) {
    if (scope) mdScope = scope;
    $('mdpanel').classList.add('open');
    updateMdControls();
    loadMd();
  }

  async function loadMd(fromModel) {
    if (!settings.bridgeUrl) return;
    const dirty = $('mdtext').value !== mdLoaded;
    if (fromModel && dirty) { $('mdNote').textContent = 'The model changed this file. Reload to see it (your unsaved edits will be lost).'; return; }
    $('mdNote').textContent = 'Loading…';
    try {
      const j = await apiJson('/api/claude-md' + q(mdTargetProject()));
      mdLoaded = j.content;
      $('mdtext').value = j.content;
      $('mdPath').textContent = j.path;
      $('mdNote').textContent = fromModel ? 'Updated by the model just now.' : j.exists ? '' : 'Not created yet. Save to create it.';
    } catch (e) {
      $('mdNote').textContent = 'Could not load: ' + e.message;
    }
  }

  async function saveMd() {
    $('mdSave').disabled = true;
    $('mdNote').textContent = 'Saving…';
    try {
      const content = $('mdtext').value;
      await apiJson('/api/claude-md' + q(mdTargetProject()), { method: 'PUT', body: JSON.stringify({ content }) });
      mdLoaded = content;
      $('mdNote').textContent = 'Saved. The previous version was backed up on your PC.';
      if (mdScope === 'project') {
        const p = projects.find((x) => x.name === project);
        if (p && !p.hasClaudeMd) { p.hasClaudeMd = true; fillProjects(); }
      }
    } catch (e) {
      $('mdNote').textContent = 'Save failed: ' + e.message;
    } finally {
      $('mdSave').disabled = false;
    }
  }

  // ---------------------------------------------------------- settings --
  function openSettings() {
    $('sUrl').value = settings.bridgeUrl;
    $('sToken').value = settings.token;
    $('sSystem').value = settings.system;
    $('sTheme').value = settings.theme;
    $('sResult').textContent = '';
    $('settings').showModal();
  }

  $('settings').addEventListener('close', () => {
    if ($('settings').returnValue !== 'save') return;
    settings = {
      bridgeUrl: $('sUrl').value.trim(),
      token: $('sToken').value.trim(),
      system: $('sSystem').value,
      theme: $('sTheme').value,
    };
    for (const k of Object.keys(settings)) store.set(k, settings[k]);
    applyTheme();
    connect();
  });

  $('sTest').addEventListener('click', async () => {
    const url = $('sUrl').value.trim().replace(/\/+$/, '');
    $('sResult').textContent = 'Testing…';
    try {
      const r = await fetch(url + '/api/status', { headers: { Authorization: 'Bearer ' + $('sToken').value.trim() } });
      if (r.status === 401) throw new Error('reached your PC, but the token is wrong');
      if (!r.ok) throw new Error('bridge error ' + r.status);
      const s = await r.json();
      $('sResult').textContent = s.lmStudio.reachable ? '✓ Connected to LM Studio' : '⚠ PC reached, but LM Studio is not running';
    } catch (e) {
      $('sResult').textContent = '✕ ' + (/fetch|network|load failed/i.test(e.message) ? 'could not reach that URL' : e.message);
    }
  });

  // ------------------------------------------------------------- wiring --
  function autosize() {
    const t = $('input');
    t.style.height = 'auto';
    t.style.height = Math.min(t.scrollHeight + 2, 200) + 'px';
    t.style.overflowY = t.scrollHeight > 200 ? 'auto' : 'hidden';
  }
  $('input').addEventListener('input', autosize);
  $('input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !matchMedia('(pointer: coarse)').matches) {
      e.preventDefault();
      send();
    }
  });
  $('send').addEventListener('click', () => send());
  $('btnSettings').addEventListener('click', openSettings);
  $('btnNew').addEventListener('click', () => {
    if (busy) busy.abort();
    messages = [];
    save(historyKey(), messages);
    render();
    $('input').focus();
  });
  $('project').addEventListener('change', () => {
    const v = $('project').value;
    if (v === NEW_PROJECT) {
      $('project').value = project;
      $('npName').value = '';
      $('npDesc').value = '';
      $('npResult').textContent = '';
      $('newProject').showModal();
      return;
    }
    switchProject(v);
  });
  $('npCreate').addEventListener('click', createProject);
  $('npName').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); createProject(); } });
  $('btnMd').addEventListener('click', () => {
    if ($('mdpanel').classList.contains('open')) $('mdpanel').classList.remove('open');
    else openPanel(project ? 'project' : 'global');
  });
  $('segProject').addEventListener('click', () => { mdScope = 'project'; updateMdControls(); mdLoaded = $('mdtext').value; loadMd(); });
  $('segGlobal').addEventListener('click', () => { mdScope = 'global'; updateMdControls(); mdLoaded = $('mdtext').value; loadMd(); });
  $('mdClose').addEventListener('click', () => $('mdpanel').classList.remove('open'));
  $('mdReload').addEventListener('click', () => { mdLoaded = $('mdtext').value; loadMd(); });
  $('mdSave').addEventListener('click', saveMd);
  $('mdGenerate').addEventListener('click', () => { if (window.innerWidth <= 860) $('mdpanel').classList.remove('open'); generateMd(); });
  $('model').addEventListener('change', () => { store.set('model', $('model').value); updateAttach(); });
  $('attach').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', () => { addFiles([...$('fileInput').files]); $('fileInput').value = ''; });
  $('input').addEventListener('paste', (e) => {
    const files = [...(e.clipboardData ? e.clipboardData.files : [])];
    if (files.length && !$('attach').disabled) { e.preventDefault(); addFiles(files); }
  });
  const col = document.querySelector('.chat-col');
  let dragDepth = 0;
  col.addEventListener('dragenter', (e) => { if ([...e.dataTransfer.types].includes('Files')) { dragDepth++; col.classList.add('drag'); } });
  col.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; col.classList.remove('drag'); } });
  col.addEventListener('dragover', (e) => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
  col.addEventListener('drop', (e) => {
    e.preventDefault();
    dragDepth = 0;
    col.classList.remove('drag');
    if (!$('attach').disabled) addFiles([...e.dataTransfer.files]);
  });
  $('allowEdits').checked = store.get('allowEdits', true);
  $('allowEdits').addEventListener('change', () => store.set('allowEdits', $('allowEdits').checked));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refreshStatus(); loadProjects(); } });

  async function connect() {
    const s = await refreshStatus();
    await loadProjects();
    switchProject(project);
    return s;
  }

  messages = store.get(historyKey(), []);
  render();
  updateMdControls();
  connect().then((s) => { if (!s && (!settings.bridgeUrl || !settings.token)) openSettings(); });
})();
</script>
</body>
</html>
