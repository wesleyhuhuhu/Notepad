<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Local LLM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #e3e2dd;
  --accent: #3b5bdb; --accent-text: #ffffff; --user-bubble: #e9ecf8; --code-bg: #f0efea;
  --ok: #2f9e44; --bad: #e03131; --warn: #e8590c; --chip: #f1f0ec;
  --radius: 12px; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a9993; --border: #33322f;
    --accent: #748ffc; --accent-text: #0e0e0d; --user-bubble: #262b40; --code-bg: #2a2a27; --chip: #2a2a27;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a9993; --border: #33322f;
  --accent: #748ffc; --accent-text: #0e0e0d; --user-bubble: #262b40; --code-bg: #2a2a27; --chip: #2a2a27;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; height: 100dvh;
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 12px; cursor: pointer;
}
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }

header {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  border-bottom: 1px solid var(--border); background: var(--panel);
}
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
.status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; min-width: 0; }
.status span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
header .spacer { flex: 1; }
header .actions { display: flex; gap: 6px; }

.layout { flex: 1; display: flex; min-height: 0; }
.chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#messages { flex: 1; overflow-y: auto; padding: 20px 16px; }
.inner { max-width: 780px; margin: 0 auto; }
.msg { margin: 0 0 18px; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .bubble {
  background: var(--user-bubble); padding: 9px 14px; border-radius: var(--radius);
  max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere;
}
.msg.assistant .body { overflow-wrap: anywhere; }
.body > :first-child { margin-top: 0; } .body > :last-child { margin-bottom: 0; }
.body pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
.body code { font-family: var(--mono); font-size: .9em; }
.body :not(pre) > code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.body table { border-collapse: collapse; display: block; overflow-x: auto; }
.body th, .body td { border: 1px solid var(--border); padding: 4px 8px; }
.body a { color: var(--accent); }
details.reasoning { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
details.reasoning summary { cursor: pointer; user-select: none; }
details.reasoning div { white-space: pre-wrap; border-left: 2px solid var(--border); padding-left: 10px; margin-top: 6px; max-height: 300px; overflow-y: auto; }
.tool {
  display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border: 1px solid var(--border);
  border-radius: 999px; padding: 2px 10px; font-size: 12.5px; color: var(--muted); margin: 0 6px 8px 0;
}
.tool.ok::before { content: "✓"; color: var(--ok); }
.tool.bad::before { content: "✕"; color: var(--bad); }
.tool.pending::before { content: "…"; }
.err { color: var(--bad); font-size: 14px; }
.cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--muted); }
@keyframes blink { 50% { opacity: 0; } }

.empty { text-align: center; color: var(--muted); margin-top: 12vh; }
.empty h2 { color: var(--text); font-weight: 600; font-size: 20px; margin-bottom: 6px; }

.composer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
.composer .inner { display: flex; gap: 8px; align-items: flex-end; }
#input {
  flex: 1; resize: none; max-height: 200px; min-height: 42px; padding: 9px 12px;
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); outline: none;
}
#input:focus { border-color: var(--accent); }
#send { height: 42px; min-width: 70px; }
.composer .meta { display: flex; gap: 14px; margin-top: 6px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.composer label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.composer select { background: transparent; border: none; color: var(--muted); max-width: 260px; padding: 0; }

aside#mdpanel {
  width: 440px; max-width: 100%; border-left: 1px solid var(--border); background: var(--panel);
  display: none; flex-direction: column; min-height: 0;
}
aside#mdpanel.open { display: flex; }
.md-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.md-head strong { flex: 1; }
.md-path { font-size: 12px; color: var(--muted); padding: 6px 14px 0; font-family: var(--mono); overflow-wrap: anywhere; }
#mdtext {
  flex: 1; margin: 10px 14px; resize: none; border: 1px solid var(--border); border-radius: 8px;
  padding: 10px; background: var(--bg); font-family: var(--mono); font-size: 13px; line-height: 1.5; outline: none;
}
#mdtext:focus { border-color: var(--accent); }
.md-foot { display: flex; gap: 8px; align-items: center; padding: 0 14px 14px; }
.md-foot .note { flex: 1; font-size: 12.5px; color: var(--muted); }
@media (max-width: 860px) {
  aside#mdpanel.open { position: fixed; inset: 0; width: auto; z-index: 20; border: none; }
}

dialog {
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); color: var(--text);
  width: min(520px, calc(100vw - 32px)); padding: 20px;
}
dialog::backdrop { background: rgb(0 0 0 / .4); }
dialog h2 { margin: 0 0 14px; font-size: 18px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.field input[type=text], .field input[type=password], .field input[type=url], .field textarea, .field select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
}
.field .hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.row .grow { flex: 1; font-size: 13px; }
@media (max-width: 520px) {
  header h1 { display: none; }
  header .actions button { padding: 6px 9px; }
}
</style>
</head>
<body>
<header>
  <h1>Local LLM</h1>
  <div class="status" title="Bridge status"><span class="dot" id="dot"></span><span id="statusText">Not connected</span></div>
  <div class="spacer"></div>
  <div class="actions">
    <button id="btnMd" title="View and edit CLAUDE.md">CLAUDE.md</button>
    <button id="btnNew" title="Start a new chat">New</button>
    <button id="btnSettings" title="Settings">Settings</button>
  </div>
</header>

<div class="layout">
  <div class="chat-col">
    <div id="messages"><div class="inner" id="list"></div></div>
    <div class="composer">
      <div class="inner">
        <textarea id="input" rows="1" placeholder="Message your local model…"></textarea>
        <button id="send" class="primary">Send</button>
      </div>
      <div class="inner meta">
        <label title="Model to use">Model <select id="model"><option value="">(default)</option></select></label>
        <label title="Let the model change CLAUDE.md with tools"><input type="checkbox" id="allowEdits" checked> Model can edit CLAUDE.md</label>
      </div>
    </div>
  </div>

  <aside id="mdpanel" aria-label="CLAUDE.md editor">
    <div class="md-head">
      <strong>CLAUDE.md</strong>
      <button id="mdReload">Reload</button>
      <button id="mdClose">Close</button>
    </div>
    <div class="md-path" id="mdPath"></div>
    <textarea id="mdtext" spellcheck="false" placeholder="CLAUDE.md is empty. Write standing instructions or notes here."></textarea>
    <div class="md-foot">
      <span class="note" id="mdNote"></span>
      <button id="mdSave" class="primary">Save</button>
    </div>
  </aside>
</div>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>Settings</h2>
    <div class="field">
      <label for="sUrl">Bridge URL</label>
      <input type="url" id="sUrl" placeholder="https://your-pc.your-tailnet.ts.net" autocomplete="off">
      <div class="hint">The public address printed by <code>start.ps1</code> on your PC.</div>
    </div>
    <div class="field">
      <label for="sToken">Access token</label>
      <input type="password" id="sToken" autocomplete="off">
      <div class="hint">From <code>bridge/config.json</code>. Stored only in this browser.</div>
    </div>
    <div class="field">
      <label for="sSystem">Extra system prompt (optional)</label>
      <textarea id="sSystem" rows="3"></textarea>
      <div class="hint">Added after CLAUDE.md. Use CLAUDE.md for anything you want kept on the PC.</div>
    </div>
    <div class="field">
      <label for="sTheme">Theme</label>
      <select id="sTheme"><option value="">Match system</option><option value="light">Light</option><option value="dark">Dark</option></select>
    </div>
    <div class="row">
      <span class="grow" id="sResult"></span>
      <button type="button" id="sTest">Test connection</button>
      <button value="cancel" formnovalidate>Cancel</button>
      <button value="save" class="primary" id="sSave">Save</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('llm.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('llm.' + k, JSON.stringify(v)); } catch {} },
  };

  // One-click setup: index.html#bridge=<url>&token=<token>
  function consumeHash() {
    if (location.hash.length <= 1) return false;
    const p = new URLSearchParams(location.hash.slice(1));
    if (!p.get('bridge') && !p.get('token')) return false;
    if (p.get('bridge')) store.set('bridgeUrl', p.get('bridge'));
    if (p.get('token')) store.set('token', p.get('token'));
    history.replaceState(null, '', location.pathname + location.search);
    return true;
  }
  consumeHash();
  window.addEventListener('hashchange', () => {
    if (!consumeHash()) return;
    settings.bridgeUrl = store.get('bridgeUrl', '');
    settings.token = store.get('token', '');
    if ($('settings').open) $('settings').close('cancel');
    refreshStatus();
  });

  let settings = {
    bridgeUrl: store.get('bridgeUrl', ''),
    token: store.get('token', ''),
    system: store.get('system', ''),
    theme: store.get('theme', ''),
  };
  let messages = store.get('messages', []);
  let busy = null; // AbortController while streaming

  const applyTheme = () => {
    if (settings.theme) document.documentElement.dataset.theme = settings.theme;
    else delete document.documentElement.dataset.theme;
  };
  applyTheme();

  const base = () => settings.bridgeUrl.replace(/\/+$/, '');
  const api = (path, opts = {}) =>
    fetch(base() + path, {
      ...opts,
      headers: { Authorization: 'Bearer ' + settings.token, 'Content-Type': 'application/json', ...(opts.headers || {}) },
    });

  // ------------------------------------------------------------ status --
  function setStatus(kind, text) {
    $('dot').className = 'dot ' + (kind || '');
    $('statusText').textContent = text;
  }

  async function refreshStatus() {
    if (!settings.bridgeUrl || !settings.token) { setStatus('warn', 'Open Settings to connect'); return null; }
    try {
      const r = await api('/api/status');
      if (r.status === 401) { setStatus('bad', 'Wrong access token'); return null; }
      if (!r.ok) { setStatus('bad', 'Bridge error ' + r.status); return null; }
      const s = await r.json();
      if (!s.lmStudio.reachable) setStatus('warn', 'PC online, LM Studio off');
      else {
        const loaded = s.lmStudio.models.filter((m) => m.loaded);
        setStatus('ok', loaded.length ? loaded.map((m) => m.id).join(', ') : 'Connected (no model loaded)');
      }
      fillModels(s);
      $('allowEdits').disabled = !s.allowModelEdits;
      if (!s.allowModelEdits) $('allowEdits').checked = false;
      return s;
    } catch {
      setStatus('bad', 'PC unreachable');
      return null;
    }
  }

  function fillModels(s) {
    const sel = $('model');
    const keep = store.get('model', '');
    sel.innerHTML = '';
    const def = document.createElement('option');
    def.value = '';
    def.textContent = s.defaultModel ? `(default: ${s.defaultModel})` : '(loaded model)';
    sel.appendChild(def);
    for (const m of s.lmStudio.models || []) {
      const o = document.createElement('option');
      o.value = m.id;
      o.textContent = m.id + (m.loaded ? ' ●' : '');
      sel.appendChild(o);
    }
    sel.value = [...sel.options].some((o) => o.value === keep) ? keep : '';
  }

  // ------------------------------------------------------------ render --
  function splitThink(text) {
    let reasoning = '';
    let out = text.replace(/<think>([\s\S]*?)<\/think>/g, (_, r) => { reasoning += r; return ''; });
    const open = out.indexOf('<think>');
    if (open >= 0) { reasoning += out.slice(open + 7); out = out.slice(0, open); }
    return { reasoning: reasoning.trim(), content: out.trim() };
  }

  const md = (t) => DOMPurify.sanitize(marked.parse(t || '', { gfm: true, breaks: true }));

  function toolLabel(t) {
    const names = {
      read_claude_md: 'Read CLAUDE.md', append_to_claude_md: 'Added to CLAUDE.md',
      replace_in_claude_md: 'Edited CLAUDE.md', write_claude_md: 'Rewrote CLAUDE.md',
    };
    return names[t.name] || t.name;
  }

  function renderAssistant(el, m, streaming) {
    const { reasoning: inlineR, content } = splitThink(m.content || '');
    const reasoning = [m.reasoning || '', inlineR].filter(Boolean).join('\n').trim();
    el.innerHTML = '';
    if (reasoning) {
      const d = document.createElement('details');
      d.className = 'reasoning';
      d.open = !!(streaming && !content);
      const s = document.createElement('summary');
      s.textContent = streaming && !content ? 'Thinking…' : 'Reasoning';
      const b = document.createElement('div');
      b.textContent = reasoning;
      d.append(s, b);
      el.appendChild(d);
    }
    if (m.tools && m.tools.length) {
      const wrap = document.createElement('div');
      for (const t of m.tools) {
        const c = document.createElement('span');
        c.className = 'tool ' + (t.ok === undefined ? 'pending' : t.ok ? 'ok' : 'bad');
        c.textContent = toolLabel(t);
        if (t.result && !t.ok) c.title = t.result;
        wrap.appendChild(c);
      }
      el.appendChild(wrap);
    }
    const body = document.createElement('div');
    body.className = 'body' + (streaming ? ' cursor' : '');
    body.innerHTML = md(content);
    el.appendChild(body);
    if (m.error) {
      const e = document.createElement('div');
      e.className = 'err';
      e.textContent = m.error;
      el.appendChild(e);
    }
  }

  function render() {
    const list = $('list');
    list.innerHTML = '';
    if (!messages.length) {
      list.innerHTML = '<div class="empty"><h2>Your model, from anywhere</h2><p>Messages go to LM Studio on your PC. It reads CLAUDE.md on every turn and can update it when you ask it to remember something.</p></div>';
      return;
    }
    for (const m of messages) list.appendChild(msgEl(m));
    scrollDown(true);
  }

  function msgEl(m, streaming) {
    const el = document.createElement('div');
    el.className = 'msg ' + m.role;
    if (m.role === 'user') {
      const b = document.createElement('div');
      b.className = 'bubble';
      b.textContent = m.content;
      el.appendChild(b);
    } else renderAssistant(el, m, streaming);
    return el;
  }

  function scrollDown(force) {
    const box = $('messages');
    if (force || box.scrollHeight - box.scrollTop - box.clientHeight < 120) box.scrollTop = box.scrollHeight;
  }

  const save = () => store.set('messages', messages.slice(-100));

  // -------------------------------------------------------------- chat --
  async function send() {
    if (busy) { busy.abort(); return; }
    const text = $('input').value.trim();
    if (!text) return;
    if (!settings.bridgeUrl || !settings.token) { openSettings(); return; }

    $('input').value = '';
    autosize();
    if (!messages.length) $('list').innerHTML = '';
    const user = { role: 'user', content: text };
    messages.push(user);
    $('list').appendChild(msgEl(user));
    const a = { role: 'assistant', content: '', reasoning: '', tools: [] };
    messages.push(a);
    const el = msgEl(a, true);
    $('list').appendChild(el);
    scrollDown(true);

    busy = new AbortController();
    $('send').textContent = 'Stop';
    let frame = 0;
    const paint = () => { if (!frame) frame = requestAnimationFrame(() => { frame = 0; renderAssistant(el, a, true); scrollDown(); }); };

    try {
      const history = messages.slice(0, -1).filter((m) => !m.error || m.content).map((m) => ({ role: m.role, content: m.content }));
      const r = await api('/api/chat', {
        method: 'POST',
        signal: busy.signal,
        body: JSON.stringify({
          messages: history,
          model: $('model').value || undefined,
          allowEdits: $('allowEdits').checked,
          system: settings.system || undefined,
        }),
      });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        throw new Error(j.error || 'Bridge error ' + r.status);
      }
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, i);
          buf = buf.slice(i + 2);
          for (const line of chunk.split('\n')) {
            if (!line.startsWith('data:')) continue;
            let ev;
            try { ev = JSON.parse(line.slice(5)); } catch { continue; }
            handleEvent(a, ev);
          }
        }
        paint();
      }
    } catch (e) {
      if (e.name !== 'AbortError') a.error = /Failed to fetch|NetworkError|Load failed/i.test(e.message) ? 'Could not reach your PC. Is the bridge running?' : e.message;
      else if (!a.content) a.error = 'Stopped.';
    } finally {
      busy = null;
      $('send').textContent = 'Send';
      if (frame) cancelAnimationFrame(frame), frame = 0;
      renderAssistant(el, a, false);
      scrollDown();
      save();
    }
  }

  function handleEvent(a, ev) {
    switch (ev.type) {
      case 'token': a.content += ev.text; break;
      case 'reasoning': a.reasoning += ev.text; break;
      case 'round_end':
        // Text streamed before a tool call is usually preamble; keep it but separate it.
        if (a.content && !a.content.endsWith('\n\n')) a.content += '\n\n';
        break;
      case 'tool_call': a.tools.push({ id: ev.id, name: ev.name }); break;
      case 'tool_result': {
        const t = a.tools.find((x) => x.id === ev.id) || {};
        t.ok = ev.ok; t.result = ev.result;
        break;
      }
      case 'claude_md_updated': if ($('mdpanel').classList.contains('open')) loadMd(true); break;
      case 'error': a.error = ev.message; break;
    }
  }

  // --------------------------------------------------------- CLAUDE.md --
  let mdLoaded = '';
  async function loadMd(fromModel) {
    if (!settings.bridgeUrl) return;
    const dirty = $('mdtext').value !== mdLoaded;
    if (fromModel && dirty) { $('mdNote').textContent = 'The model changed CLAUDE.md. Reload to see it (your unsaved edits will be lost).'; return; }
    $('mdNote').textContent = 'Loading…';
    try {
      const r = await api('/api/claude-md');
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Error ' + r.status);
      const j = await r.json();
      mdLoaded = j.content;
      $('mdtext').value = j.content;
      $('mdPath').textContent = j.path;
      $('mdNote').textContent = fromModel ? 'Updated by the model just now.' : '';
    } catch (e) {
      $('mdNote').textContent = 'Could not load: ' + e.message;
    }
  }

  async function saveMd() {
    $('mdSave').disabled = true;
    $('mdNote').textContent = 'Saving…';
    try {
      const content = $('mdtext').value;
      const r = await api('/api/claude-md', { method: 'PUT', body: JSON.stringify({ content }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Error ' + r.status);
      mdLoaded = content;
      $('mdNote').textContent = 'Saved. A backup of the old version was kept on your PC.';
    } catch (e) {
      $('mdNote').textContent = 'Save failed: ' + e.message;
    } finally {
      $('mdSave').disabled = false;
    }
  }

  // ---------------------------------------------------------- settings --
  function openSettings() {
    $('sUrl').value = settings.bridgeUrl;
    $('sToken').value = settings.token;
    $('sSystem').value = settings.system;
    $('sTheme').value = settings.theme;
    $('sResult').textContent = '';
    $('settings').showModal();
  }

  $('settings').addEventListener('close', () => {
    if ($('settings').returnValue !== 'save') return;
    settings = {
      bridgeUrl: $('sUrl').value.trim(),
      token: $('sToken').value.trim(),
      system: $('sSystem').value,
      theme: $('sTheme').value,
    };
    for (const k of Object.keys(settings)) store.set(k, settings[k]);
    applyTheme();
    refreshStatus();
  });

  $('sTest').addEventListener('click', async () => {
    const url = $('sUrl').value.trim().replace(/\/+$/, '');
    $('sResult').textContent = 'Testing…';
    try {
      const r = await fetch(url + '/api/status', { headers: { Authorization: 'Bearer ' + $('sToken').value.trim() } });
      if (r.status === 401) throw new Error('reached your PC, but the token is wrong');
      if (!r.ok) throw new Error('bridge error ' + r.status);
      const s = await r.json();
      $('sResult').textContent = s.lmStudio.reachable ? '✓ Connected to LM Studio' : '⚠ PC reached, but LM Studio is not running';
    } catch (e) {
      $('sResult').textContent = '✕ ' + (/fetch|network|load failed/i.test(e.message) ? 'could not reach that URL' : e.message);
    }
  });

  // ------------------------------------------------------------- wiring --
  function autosize() {
    const t = $('input');
    t.style.height = 'auto';
    t.style.height = Math.min(t.scrollHeight + 2, 200) + 'px';
    t.style.overflowY = t.scrollHeight > 200 ? 'auto' : 'hidden';
  }
  $('input').addEventListener('input', autosize);
  $('input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !matchMedia('(pointer: coarse)').matches) {
      e.preventDefault();
      send();
    }
  });
  $('send').addEventListener('click', send);
  $('btnSettings').addEventListener('click', openSettings);
  $('btnNew').addEventListener('click', () => {
    if (busy) busy.abort();
    messages = [];
    save();
    render();
    $('input').focus();
  });
  $('btnMd').addEventListener('click', () => {
    const p = $('mdpanel');
    p.classList.toggle('open');
    if (p.classList.contains('open')) loadMd();
  });
  $('mdClose').addEventListener('click', () => $('mdpanel').classList.remove('open'));
  $('mdReload').addEventListener('click', () => { mdLoaded = $('mdtext').value; loadMd(); });
  $('mdSave').addEventListener('click', saveMd);
  $('model').addEventListener('change', () => store.set('model', $('model').value));
  $('allowEdits').checked = store.get('allowEdits', true);
  $('allowEdits').addEventListener('change', () => store.set('allowEdits', $('allowEdits').checked));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshStatus(); });

  render();
  refreshStatus().then((s) => { if (!s && (!settings.bridgeUrl || !settings.token)) openSettings(); });
})();
</script>
</body>
</html>
